<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Desktop PC - History Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Exo+2:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #134074;
    --primary-dark: #0d2b4d;
    --primary-light: #e8f0ff;
    --primary-rgb: 19, 64, 116;
    --accent: #0f766e;
    --accent-light: #dff7f3;
    --accent-rgb: 15, 118, 110;
    --border: #0f172a;
    --grid-border: #d1d9e6;
    --th-bg: #f8fbff;
    --dot-color: rgba(19,64,116,0.10);
    --base-font: 'Manrope', 'Segoe UI', Arial, sans-serif;
    --base-size: 10.5pt;
    --header-font: 'Exo 2', 'Segoe UI', sans-serif;
}

@page { size: A4; margin: 10mm 10mm 18mm; }

*, *::before, *::after { box-sizing: border-box; }

body {
    font-family: var(--base-font);
    font-size: var(--base-size);
    line-height: 1.5;
    color: #0f172a;
    margin: 0;
    padding: 16px;
    background:
        radial-gradient(circle at 12% 18%, rgba(var(--accent-rgb), 0.18), transparent 30%),
        radial-gradient(circle at 86% 12%, rgba(var(--primary-rgb), 0.16), transparent 34%),
        linear-gradient(145deg, #f3f8ff 0%, #eef4fb 55%, #edf3f9 100%);
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
    padding: 10px 16px;
    background: linear-gradient(135deg, var(--primary-dark), var(--primary) 55%, var(--accent));
    border-radius: 12px;
    position: sticky;
    top: 10px;
    z-index: 1000;
    box-shadow: 0 8px 28px rgba(15,39,71,0.28);
}

.controls button, .controls select, .controls input[type="number"] {
    padding: 5px 12px;
    font-size: 8.5pt;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.09);
    color: #f8fbff;
    font-weight: 600;
    border-radius: 7px;
    font-family: var(--base-font);
    transition: transform 0.15s, background 0.15s;
}

.controls button:hover {
    background: rgba(255,255,255,0.19);
    transform: translateY(-1px);
}

.controls select {
    color: #f8fbff;
    background: rgba(12,22,37,0.58);
}
.controls select option {
    color: #0f172a;
    background: #ffffff;
}
.controls input[type="number"] { width: 60px; }

.container {
    max-width: 860px;
    margin: 0 auto;
    background: #ffffff;
    padding: 28px 30px 24px;
    border: 1px solid rgba(19,64,116,0.18);
    border-radius: 12px;
    position: relative;
    box-shadow: 0 18px 40px rgba(13,43,77,0.14);
}

.container::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(19,64,116,0.10);
    pointer-events: none;
    border-radius: 8px;
}

.header-layout {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 0;
    padding-bottom: 0;
    position: relative;
}

.header-layout::after {
    content: '';
    width: 152px;
    min-width: 152px;
}

.logo-container {
    width: 152px;
    min-width: 152px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
}

.header-logo {
    width: 100%;
    max-width: 150px;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.10);
}

.header-titles {
    flex: 1;
    min-width: 0;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.title-block {
    background: transparent;
    width: 100%;
    max-width: 100%;
    padding: 0;
    margin: 2px 0 6px;
}

.title-block::before {
    content: none;
}

.title-input {
    font-family: 'Cinzel', var(--header-font);
    font-size: clamp(30pt, 5vw, 42pt);
    font-weight: 800;
    text-transform: capitalize;
    letter-spacing: 1.1px;
    color: #000000;
    border: none;
    background: transparent;
    width: 100%;
    max-width: 100%;
    text-align: center;
    outline: none;
    line-height: 1.12;
    background-image: none;
    -webkit-background-clip: border-box;
    background-clip: border-box;
    -webkit-text-fill-color: #000000;
    text-shadow: 0 1px 0 #ffffff, 0 2px 0 #cfcfcf, 0 3px 0 #a7a7a7, 0 6px 10px rgba(0,0,0,0.30);
    animation: none;
}

.subtitle-block {
    margin-top: 8px;
    background: transparent;
    border-radius: 0;
    padding: 2px 16px 1px;
    box-shadow: none;
}

.subtitle-input {
    font-family: var(--header-font);
    font-size: 13pt;
    font-weight: 700;
    color: color-mix(in srgb, var(--primary) 84%, #111 16%);
    border: none;
    background: transparent;
    width: 100%;
    text-align: center;
    outline: none;
    letter-spacing: 0.45px;
}

.header-divider {
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 14px 0 14px;
    border-radius: 999px;
}

.block-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-bottom: 10px;
}

.block-actions button {
    border: none;
    background: linear-gradient(130deg, var(--primary), color-mix(in srgb, var(--primary) 65%, var(--accent) 35%));
    color: #f8fbff;
    font-weight: 700;
    letter-spacing: 0.35px;
    font-size: 8.6pt;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(19,64,116,0.26);
    transition: transform 0.15s, box-shadow 0.15s;
}

.block-actions button:hover {
    transform: translateY(-1px);
    box-shadow: 0 7px 14px rgba(19,64,116,0.30);
}

.section-tools {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin: 6px 0 6px;
}

.section-tools button {
    border: 1px solid rgba(19,64,116,0.35);
    background: #ffffff;
    color: var(--primary-dark);
    font-weight: 700;
    font-size: 8.1pt;
    border-radius: 6px;
    padding: 4px 9px;
    cursor: pointer;
}

.section-tools button:hover {
    background: var(--primary-light);
}

h3 {
    font-family: var(--header-font);
    font-size: 9.6pt;
    margin: 16px 0 0;
    padding: 8px 12px;
    background: linear-gradient(95deg, var(--primary-dark) 0%, var(--primary) 55%, var(--accent) 100%);
    color: #f8fbff;
    display: flex;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 5px 14px rgba(19,64,116,0.20);
}

table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    border-spacing: 0;
    margin: 0 0 10px;
    border: 1px solid var(--grid-border);
    background: #ffffff;
}

th, td {
    border: 1px solid var(--grid-border);
    padding: 8px 10px;
    vertical-align: middle;
    word-break: break-word;
    background: #ffffff;
}

th {
    background: #f7f9fc;
    text-align: left;
    font-weight: 600;
    color: var(--primary-dark);
    font-size: 9.5pt;
}

.section-table { width: 100%; table-layout: fixed; }
.section-table th { width: 36%; }

#serviceTable { width: 100%; table-layout: fixed; }
#serviceTable input {
    width: 100%;
    min-width: 0;
    display: block;
}

#serviceTable th:nth-child(1),
#serviceTable td:nth-child(1) {
    width: 40px;
    text-align: center;
}

#serviceTable th:last-child,
#serviceTable td:last-child {
    width: 36px;
    text-align: center;
}

input[type="text"], input[type="date"] {
    width: 100%;
    border: none;
    font-family: inherit;
    font-size: inherit;
    background: transparent;
    outline: none;
    color: #0f172a;
}

input[type="text"]:focus, input[type="date"]:focus {
    background: #f3f9ff;
    border-radius: 3px;
}

input[type="date"]:invalid { color: transparent; }
input[type="date"]:focus, input[type="date"]:valid { color: inherit; }

span.lbl {
    cursor: pointer;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.15s;
}

span.lbl:hover {
    border-bottom-color: #7f9ab5;
    color: var(--primary);
}

.print-hide-btn {
    cursor: pointer;
    font-size: 7.5pt;
    color: #6b7280;
    font-weight: normal;
}

.print-hide-btn:hover { color: #1f2937; }
.edit-icon { color: #ca8a04; font-size: 10pt; font-weight: 700; cursor: pointer; }
.edit-icon:hover { color: #a16207; }
.row-del { color: #dc2626; font-weight: bold; cursor: pointer; }
.row-del:hover { color: #b91c1c; }

.reorder-btn {
    color: #607489;
    cursor: pointer;
    font-size: 8pt;
    padding: 0 2px;
}

.reorder-btn:hover { color: #1f4d76; }

.drag-handle {
    cursor: grab;
    color: #8096ab;
    font-size: 10pt;
    padding: 0 4px;
    user-select: none;
}

.drag-handle:active { cursor: grabbing; }

.signature-section {
    margin-top: 42px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 30px;
    position: relative;
}

.signature-section::before {
    content: '';
    position: absolute;
    top: 6px;
    bottom: 6px;
    left: 50%;
    width: 1px;
    background: color-mix(in srgb, var(--accent) 34%, #cfd8e3 66%);
}

.sig-block {
    flex: 1;
    width: 50%;
    max-width: 360px;
    text-align: center;
    border: none;
    padding: 2px 16px;
    border-radius: 0;
    background: transparent;
}

.sig-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 7.3pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--accent);
    margin-bottom: 8px;
}

.sig-label::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(140deg, var(--accent), var(--primary));
}

.sig-name-input {
    font-weight: 800;
    font-size: 13pt;
    border: none;
    background: transparent;
    width: 100%;
    text-align: center;
    outline: none;
    margin-bottom: 6px;
    padding: 0 0 4px;
    font-family: inherit;
    color: #102030;
    background-image: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, var(--primary) 30%), color-mix(in srgb, var(--primary) 55%, #ffffff 45%));
    background-repeat: no-repeat;
    background-size: 100% 2px;
    background-position: left bottom;
}

.sig-designation-input {
    font-size: 9.6pt;
    color: color-mix(in srgb, var(--primary-dark) 62%, #7b8fa7 38%);
    border: none;
    background: transparent;
    width: 100%;
    text-align: center;
    outline: none;
    font-family: inherit;
}

.print-page-number { display: none; }

@media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .controls, .block-actions, .print-hide-btn, .row-del, .drag-handle, .reorder-btn, .edit-icon { display: none !important; }
    body { background: white; padding: 0; }
    .container { border: 1px solid var(--grid-border); box-shadow: none; padding: 14px 12px 16px; width: 100%; border-radius: 0; }
    .container::before, .title-block::before { display: none; }
    .header-layout {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 6px !important;
    }
    .header-layout::after {
        content: '' !important;
        display: block !important;
        width: 84px !important;
        min-width: 84px !important;
    }
    .logo-container {
        width: 84px !important;
        min-width: 84px !important;
    }
    .header-titles {
        flex: 1 !important;
        min-width: 0 !important;
        width: auto !important;
    }
    .title-block {
        width: 100% !important;
        margin: 0 !important;
    }
    table {
        width: 100% !important;
        table-layout: fixed !important;
        border-collapse: collapse !important;
        border-spacing: 0 !important;
        border: 1px solid var(--grid-border) !important;
    }
    th, td {
        border: 1px solid var(--grid-border) !important;
    }
    h3 {
        background: var(--primary) !important;
        color: #fff !important;
        box-shadow: none !important;
        border: 1px solid var(--grid-border) !important;
        border-radius: 0 !important;
        break-after: avoid !important;
        page-break-after: avoid !important;
    }
    th:first-child,
    td:first-child {
        border-left: 1px solid var(--grid-border) !important;
    }
    tr, th, td {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
    }
    input[type="date"]:invalid { display: none !important; }
    .title-input {
        color: #000000 !important;
        -webkit-text-fill-color: #000000 !important;
        font-size: clamp(15pt, 3.6vw, 19pt) !important;
        letter-spacing: 0.2px !important;
        background: transparent !important;
        text-shadow: none !important;
        padding: 0 !important;
        max-width: 100% !important;
        animation: none !important;
    }
    .subtitle-input { color: var(--primary-dark) !important; }
    th { background: var(--th-bg) !important; }
    .signature-section {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: flex-start !important;
        gap: 24px !important;
        margin-top: 28px !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
    }
    .signature-section::before {
        content: '' !important;
        left: 50% !important;
        top: 4px !important;
        bottom: 4px !important;
        width: 1px !important;
        background: #bfc8d5 !important;
    }
    .sig-block {
        flex: 1 1 0 !important;
        width: 50% !important;
        max-width: none !important;
        padding: 0 12px !important;
        text-align: center !important;
        background: transparent !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
    }
    .print-page-number {
        display: block !important;
        position: fixed;
        bottom: 3mm;
        right: 10mm;
        font-size: 9pt;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
        color: #334155;
        background: rgba(255,255,255,0.95);
        padding: 1px 6px;
        border-radius: 999px;
        z-index: 9999;
    }
    .print-page-number::after { content: "Page " counter(page) " of " counter(pages); }
}

tr.drag-over { outline: 2px dashed var(--accent); background: #eef8ff; }

@keyframes glossSweep {
    0%, 12% { transform: translateX(-130%); }
    36%, 100% { transform: translateX(145%); }
}

@keyframes glossText {
    0%, 20%, 100% { filter: brightness(1); }
    45% { filter: brightness(1.16); }
}

@media (max-width: 820px) {
    .header-layout {
        flex-direction: column;
        gap: 8px;
    }
    .header-layout::after {
        display: none;
    }
    .logo-container {
        width: 130px;
        min-width: 130px;
    }
    .title-input {
        font-size: 34pt;
    }
    .signature-section {
        flex-direction: column;
        gap: 18px;
        align-items: stretch;
    }
    .signature-section::before {
        content: none;
    }
    .sig-block {
        width: 100%;
        max-width: none;
        padding: 0 4px;
    }
}
</style>
</head>
<body>

<div class="controls">
    <button onclick="loadAll()">Load</button>
    <button onclick="saveAsPDF()">Save as PDF</button>
    <button onclick="prepareAndPrint()">Print</button>

    <select id="fontSelect" onchange="changeFont(this.value)" title="Font">
        <optgroup label="Modern / Clean">
            <option value="'Manrope', sans-serif" selected>Manrope (Default)</option>
            <option value="'Nunito', sans-serif">Nunito</option>
            <option value="'DM Sans', sans-serif">DM Sans</option>
            <option value="'Ubuntu', sans-serif">Ubuntu</option>
            <option value="'Exo 2', sans-serif">Exo 2</option>
        </optgroup>
        <optgroup label="Professional / Sans">
            <option value="'Segoe UI', Tahoma, sans-serif">Segoe UI</option>
            <option value="'Calibri', Candara, sans-serif">Calibri</option>
            <option value="Arial, Helvetica, sans-serif">Arial</option>
            <option value="Verdana, Geneva, sans-serif">Verdana</option>
            <option value="Tahoma, Geneva, sans-serif">Tahoma</option>
            <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
        </optgroup>
        <optgroup label="Formal / Serif">
            <option value="'Playfair Display', serif">Playfair Display</option>
            <option value="'Roboto Slab', serif">Roboto Slab</option>
            <option value="'Libre Baskerville', serif">Libre Baskerville</option>
            <option value="'Times New Roman', Times, serif">Times New Roman</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="Garamond, serif">Garamond</option>
            <option value="'Palatino Linotype', Palatino, serif">Palatino</option>
        </optgroup>
        <optgroup label="Technical / Mono">
            <option value="'Source Code Pro', monospace">Source Code Pro</option>
            <option value="Consolas, monospace">Consolas</option>
            <option value="'Courier New', monospace">Courier New</option>
        </optgroup>
    </select>

    <input type="number" id="fontSizeInput" value="10.5" step="0.5" min="8" max="16" title="Font size" onchange="changeFontSize(this.value)">

    <select id="themeSelect" onchange="applyTheme(this.value)" title="Theme">
        <option value="#134074" data-accent="#0f766e" selected>Navy Professional</option>
        <option value="#0f3460" data-accent="#0891b2">Blue Executive</option>
        <option value="#1f3b4d" data-accent="#2b8a3e">Charcoal Green</option>
        <option value="#5b2333" data-accent="#b45309">Maroon Corporate</option>
        <option value="#1e293b" data-accent="#2563eb">Slate Enterprise</option>
        <option value="#0b1026" data-accent="#22d3ee">Midnight Neon</option>
        <option value="#16213e" data-accent="#e94560">Cyber Crimson</option>
        <option value="#0f172a" data-accent="#38bdf8">Arctic Tech</option>
        <option value="#1a1f36" data-accent="#a78bfa">Quantum Violet</option>
        <option value="#153243" data-accent="#2dd4bf">Aqua Circuit</option>
        <option value="#2b2d42" data-accent="#f72585">Fusion Magenta</option>
        <option value="#112d32" data-accent="#84cc16">Neon Matrix</option>
        <option value="#2a1a36" data-accent="#fb7185">Aurora Pulse</option>
    </select>

    <button onclick="location.reload()" style="color:#fecaca" title="Reset all">Reset</button>
</div>

<div class="container" id="historySheet">
    <div class="header-layout">
        <div class="logo-container">
            <img src="logo post.jpeg" class="header-logo" alt="India Post Logo">
        </div>
        <div class="header-titles">
            <div class="title-block">
                <input class="title-input" type="text" value="Desktop PC - History Sheet" id="titleText">
            </div>
            <div class="subtitle-block">
                <input class="subtitle-input" type="text" value="RAMACHANDRAPURAM H.O" id="officeText">
            </div>
        </div>
    </div>

    <div class="header-divider"></div>

    <div class="block-actions print-hide-btn">
        <button onclick="saveData()">Save</button>
        <button onclick="saveAs()">Save As</button>
        <button onclick="addBlock()">Add Block</button>
    </div>

    <h3>1. EQUIPMENT DETAILS</h3>
    <div class="section-tools print-hide-btn">
        <button type="button" onclick="promptAddRow('equipBody')">Add Field</button>
        <button type="button" onclick="addColumnToSection('equipBody')">Add Column</button>
        <button type="button" onclick="removeColumnFromSection('equipBody')">Remove Column</button>
    </div>
    <table class="section-table"><tbody id="equipBody"></tbody></table>

    <h3>2. HARDWARE CONFIGURATION</h3>
    <div class="section-tools print-hide-btn">
        <button type="button" onclick="promptAddRow('hardwareBody')">Add Field</button>
        <button type="button" onclick="addColumnToSection('hardwareBody')">Add Column</button>
        <button type="button" onclick="removeColumnFromSection('hardwareBody')">Remove Column</button>
    </div>
    <table class="section-table"><tbody id="hardwareBody"></tbody></table>

    <h3>3. SOFTWARE DETAILS</h3>
    <div class="section-tools print-hide-btn">
        <button type="button" onclick="promptAddRow('softwareBody')">Add Field</button>
        <button type="button" onclick="addColumnToSection('softwareBody')">Add Column</button>
        <button type="button" onclick="removeColumnFromSection('softwareBody')">Remove Column</button>
    </div>
    <table class="section-table"><tbody id="softwareBody"></tbody></table>

    <h3>4. PURCHASE AND WARRANTY</h3>
    <div class="section-tools print-hide-btn">
        <button type="button" onclick="promptAddRow('purchaseBody')">Add Field</button>
        <button type="button" onclick="addColumnToSection('purchaseBody')">Add Column</button>
        <button type="button" onclick="removeColumnFromSection('purchaseBody')">Remove Column</button>
    </div>
    <table class="section-table"><tbody id="purchaseBody"></tbody></table>

    <h3>5. SERVICE HISTORY</h3>
    <div class="section-tools print-hide-btn">
        <button type="button" onclick="addServiceRow()">Add Field</button>
        <button type="button" onclick="addServiceColumn()">Add Column</button>
    </div>
    <table id="serviceTable">
        <thead>
            <tr id="serviceHeader"></tr>
        </thead>
        <tbody id="serviceBody"></tbody>
    </table>

    <div class="signature-section">
        <div class="sig-block">
            <div class="sig-label">Prepared By</div>
            <input class="sig-name-input" type="text" id="prepByName" value="B. Gowri Shankar">
            <input class="sig-designation-input" type="text" id="prepByDesig" value="System Manager">
        </div>
        <div class="sig-block">
            <div class="sig-label">Verified By</div>
            <input class="sig-name-input" type="text" id="verByName" placeholder="Name">
            <input class="sig-designation-input" type="text" id="verByDesig" placeholder="Designation">
        </div>
    </div>
</div>

<div class="print-page-number" aria-hidden="true"></div>

<script>
const INITIAL_DATA = {
    equipBody: [
        {label:'Model', val:'HLBS CM44', type:'text'},
        {label:'Make', val:'HLBS', type:'text'},
        {label:'Serial Number', val:'', type:'text'},
        {label:'Asset / Tag No.', val:'', type:'text'},
        {label:'Location / Room', val:'', type:'text'}
    ],
    hardwareBody: [
        {label:'Processor', val:'', type:'text'},
        {label:'RAM', val:'16 GB', type:'text'},
        {label:'HDD / SSD', val:'1 TB', type:'text'},
        {label:'Monitor', val:'', type:'text'},
        {label:'UPS', val:'', type:'text'}
    ],
    softwareBody: [
        {label:'Operating System', val:'Windows 11 Pro', type:'text'},
        {label:'Office Suite', val:'', type:'text'},
        {label:'Antivirus', val:'', type:'text'}
    ],
    purchaseBody: [
        {label:'Supplier / Vendor', val:'', type:'text'},
        {label:'Purchase / Receipt Date', val:'', type:'date'},
        {label:'Warranty Upto', val:'', type:'date'},
        {label:'AMC Upto', val:'', type:'date'},
        {label:'Invoice No.', val:'', type:'text'}
    ]
};

const STATIC_SECTION_IDS = ['equipBody', 'hardwareBody', 'softwareBody', 'purchaseBody'];

function cleanHeadingText(text) {
    return (text || '').replace(/^\d+\.\s*/, '').trim();
}

function renumberBlockHeadings() {
    document.querySelectorAll('#historySheet h3').forEach(function(h, idx) {
        const base = (h.dataset.baseTitle || cleanHeadingText(h.innerText) || 'NEW BLOCK').toUpperCase();
        h.dataset.baseTitle = base;
        h.innerText = (idx + 1) + '. ' + base;
    });
}

function createValueCell(type, value) {
    const td = document.createElement('td');
    const input = document.createElement('input');
    input.type = type || 'text';
    if ((type || 'text') === 'date') input.value = value || '';
    else input.value = value || '';
    td.appendChild(input);
    return td;
}

function normalizeSectionRows(tbodyId) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;

    const rows = Array.from(tbody.querySelectorAll('tr'));
    if (!rows.length) return;

    let maxValueCells = 0;
    rows.forEach(function(row) {
        const valueCells = row.querySelectorAll('td').length;
        if (valueCells > maxValueCells) maxValueCells = valueCells;
    });

    rows.forEach(function(row) {
        while (row.querySelectorAll('td').length < maxValueCells) {
            row.appendChild(createValueCell('text', ''));
        }
    });
}

function createRow(tbodyId, label, val, type, extraCells) {
    const tr = document.createElement('tr');
    tr.draggable = true;
    tr.dataset.id = Date.now() + Math.random();
    const th = document.createElement('th');
    th.innerHTML = `
        <span class="drag-handle print-hide-btn" title="Drag to reorder">::</span>
        <span class="lbl" onclick="editLabelPrompt(this)">${label}</span>
        <span style="float:right; display:inline-flex; gap:6px;" class="print-hide-btn">
            <span class="edit-icon" onclick="editLabelPrompt(this.closest('th').querySelector('.lbl'))" title="Edit label">&#9998;</span>
            <span onclick="this.closest('tr').remove()" class="row-del" title="Remove">x</span>
        </span>`;
    tr.appendChild(th);
    tr.appendChild(createValueCell(type, val));

    (extraCells || []).forEach(function(cell) {
        tr.appendChild(createValueCell(cell.type || 'text', cell.val || ''));
    });

    setupDrag(tr, tbodyId);
    return tr;
}

function initSection(tbodyId) {
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = '';
    (INITIAL_DATA[tbodyId] || []).forEach(r => tbody.appendChild(createRow(tbodyId, r.label, r.val, r.type)));
    normalizeSectionRows(tbodyId);
}

let dragSrc = null;
function setupDrag(tr, tbodyId) {
    tr.addEventListener('dragstart', function(e) {
        dragSrc = tr;
        tr.style.opacity = '0.4';
        e.dataTransfer.effectAllowed = 'move';
    });
    tr.addEventListener('dragend', function() {
        tr.style.opacity = '1';
        document.querySelectorAll('tr.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
    });
    tr.addEventListener('dragover', function(e) {
        e.preventDefault();
        tr.classList.add('drag-over');
        return false;
    });
    tr.addEventListener('dragleave', function() { tr.classList.remove('drag-over'); });
    tr.addEventListener('drop', function(e) {
        e.stopPropagation();
        if (dragSrc !== tr) {
            const tbody = document.getElementById(tbodyId);
            const rows = Array.from(tbody.children);
            const srcIdx = rows.indexOf(dragSrc);
            const tgtIdx = rows.indexOf(tr);
            if (srcIdx < tgtIdx) tbody.insertBefore(dragSrc, tr.nextSibling);
            else tbody.insertBefore(dragSrc, tr);
        }
        tr.classList.remove('drag-over');
        return false;
    });
}

function moveRow(tr, dir) {
    const tbody = tr.parentNode;
    if (dir === -1 && tr.previousElementSibling) tbody.insertBefore(tr, tr.previousElementSibling);
    else if (dir === 1 && tr.nextElementSibling) tbody.insertBefore(tr.nextElementSibling, tr);
}

function promptAddRow(tbodyId) {
    const name = prompt('Field Name:');
    if (!name) return;
    const typeChoice = confirm('Click OK for TEXT field, Cancel for DATE field');
    const type = typeChoice ? 'text' : 'date';
    document.getElementById(tbodyId).appendChild(createRow(tbodyId, name, '', type));
    normalizeSectionRows(tbodyId);
}

function addColumnToSection(tbodyId) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) { alert('Section not found.'); return; }

    if (!tbody.rows.length) {
        tbody.appendChild(createRow(tbodyId, 'Field 1', '', 'text'));
    }

    Array.from(tbody.rows).forEach(function(row) {
        row.appendChild(createValueCell('text', ''));
    });
    normalizeSectionRows(tbodyId);
}

function removeColumnFromSection(tbodyId) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) { alert('Section not found.'); return; }
    if (!tbody.rows.length) { alert('No rows available in this section.'); return; }

    normalizeSectionRows(tbodyId);
    const firstRow = tbody.rows[0];
    if (!firstRow) return;

    const valueCellCount = firstRow.querySelectorAll('td').length;
    if (valueCellCount <= 1) {
        alert('At least one value column is required.');
        return;
    }

    Array.from(tbody.rows).forEach(function(row) {
        const cells = row.querySelectorAll('td');
        if (!cells.length) return;
        cells[cells.length - 1].remove();
    });

    normalizeSectionRows(tbodyId);
}

function createCustomBlock(title, rowsData) {
    const container = document.getElementById('historySheet');
    const signatureSection = container.querySelector('.signature-section');
    const tbodyId = 'customBody_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

    const h3 = document.createElement('h3');
    h3.className = 'custom-block-title';
    h3.dataset.baseTitle = cleanHeadingText(title).toUpperCase();

    const tools = document.createElement('div');
    tools.className = 'section-tools print-hide-btn custom-block-tools';
    tools.innerHTML = `<button type="button" onclick="promptAddRow('${tbodyId}')">Add Field</button><button type="button" onclick="addColumnToSection('${tbodyId}')">Add Column</button><button type="button" onclick="removeColumnFromSection('${tbodyId}')">Remove Column</button>`;

    const table = document.createElement('table');
    table.className = 'section-table custom-table';
    table.dataset.custom = '1';
    const tbody = document.createElement('tbody');
    tbody.id = tbodyId;
    table.appendChild(tbody);

    if (Array.isArray(rowsData) && rowsData.length) {
        rowsData.forEach(function(r) {
            const vals = Array.isArray(r.values) ? r.values : [r.val || ''];
            const types = Array.isArray(r.types) ? r.types : [r.type || 'text'];
            const extras = vals.slice(1).map(function(v, idx) {
                return { val: v, type: types[idx + 1] || 'text' };
            });
            tbody.appendChild(createRow(tbodyId, r.label || 'Field', vals[0] || '', types[0] || 'text', extras));
        });
    } else {
        tbody.appendChild(createRow(tbodyId, 'Field 1', '', 'text'));
    }

    normalizeSectionRows(tbodyId);

    container.insertBefore(h3, signatureSection);
    container.insertBefore(tools, signatureSection);
    container.insertBefore(table, signatureSection);
    renumberBlockHeadings();
}

function removeCustomBlocks() {
    document.querySelectorAll('.custom-block-title, .custom-block-tools, .custom-table').forEach(function(el) {
        el.remove();
    });
}

function addBlock() {
    const blockName = prompt('New Block Title:', 'NEW BLOCK');
    if (blockName === null) return;
    const cleanName = blockName.trim().toUpperCase();
    if (!cleanName) { alert('Block name cannot be empty.'); return; }

    const exists = Array.from(document.querySelectorAll('#historySheet h3')).some(function(h) {
        return cleanHeadingText(h.innerText).toUpperCase() === cleanName;
    });
    if (exists) {
        alert('A block with this name already exists.');
        return;
    }

    createCustomBlock(cleanName);
}

function editLabelPrompt(span) {
    const n = prompt('Edit Label:', span.innerText);
    if (n !== null && n.trim()) span.innerText = n.trim();
}

function editLabel(el) {
    const span = el.classList.contains('lbl') ? el : el.closest('th, td').querySelector('.lbl');
    editLabelPrompt(span);
}

function getServiceHeaders() {
    const headers = [];
    const ths = document.querySelectorAll('#serviceHeader th');
    ths.forEach(function(th, i) {
        if (i === ths.length - 1) return;
        const lbl = th.querySelector('.lbl');
        headers.push(lbl ? lbl.innerText.trim() : th.innerText.trim());
    });
    return headers;
}

function buildServiceHeader(headers) {
    const header = document.getElementById('serviceHeader');
    const normalized = (headers && headers.length) ? headers : ['S.No', 'Date', 'Description', 'Item Serviced', 'Cost (Rs.)', 'By'];
    const widthMap = ['38px', '95px', '', '115px', '75px', '95px'];
    header.innerHTML = '';

    normalized.forEach(function(name, idx) {
        const th = document.createElement('th');
        if (widthMap[idx]) th.style.width = widthMap[idx];
        if (idx === 0) th.style.textAlign = 'center';
        if (idx >= 6) {
            th.style.width = '130px';
            th.innerHTML = `<span class="lbl" onclick="editLabelPrompt(this)">${name}</span><span class="print-hide-btn" style="float:right; color:#dc2626; cursor:pointer;" onclick="deleteColumn(this)">x</span>`;
        } else {
            th.innerHTML = `<span class="lbl" onclick="editLabel(this)">${name}</span>`;
        }
        header.appendChild(th);
    });

    const action = document.createElement('th');
    action.style.width = '36px';
    action.className = 'print-hide-btn';
    header.appendChild(action);
}

function addServiceRow() {
    const tbody = document.getElementById('serviceBody');
    const header = document.getElementById('serviceHeader');
    const row = document.createElement('tr');
    const colCount = header.cells.length;

    for (let i = 0; i < colCount; i++) {
        const td = document.createElement('td');
        if (i === 0) {
            td.style.textAlign = 'center';
            td.innerText = tbody.rows.length + 1;
        } else if (i === colCount - 1) {
            td.className = 'print-hide-btn';
            td.style.textAlign = 'center';
            td.innerHTML = '<span onclick="this.closest(\'tr\').remove(); renumberService();" class="row-del" title="Remove">x</span>';
        } else {
            const hText = header.cells[i].innerText.trim().toLowerCase();
            const isDate = hText.includes('date');
            td.innerHTML = `<input type="${isDate ? 'date' : 'text'}">`;
        }
        row.appendChild(td);
    }

    tbody.appendChild(row);
}

function renumberService() {
    document.querySelectorAll('#serviceBody tr').forEach(function(r, i) {
        r.cells[0].innerText = i + 1;
    });
}

function addServiceColumn() {
    const colName = prompt('Column Name:');
    if (!colName) return;

    const header = document.getElementById('serviceHeader');
    const th = document.createElement('th');
    th.style.width = '130px';
    th.innerHTML = `<span class="lbl" onclick="editLabelPrompt(this)">${colName}</span><span class="print-hide-btn" style="float:right; color:#dc2626; cursor:pointer;" onclick="deleteColumn(this)">x</span>`;
    header.insertBefore(th, header.lastElementChild);

    document.querySelectorAll('#serviceBody tr').forEach(function(row) {
        const td = document.createElement('td');
        td.innerHTML = '<input type="text">';
        row.insertBefore(td, row.lastElementChild);
    });
}

function deleteColumn(btn) {
    const th = btn.closest('th');
    const idx = Array.from(th.parentNode.children).indexOf(th);
    th.remove();
    document.querySelectorAll('#serviceBody tr').forEach(function(row) {
        if (row.cells[idx]) row.cells[idx].remove();
    });
    renumberService();
}

function serializeSectionRows(tbodyId) {
    const rows = [];
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return rows;

    tbody.querySelectorAll('tr').forEach(function(tr) {
        const lbl = tr.querySelector('.lbl');
        const inputs = Array.from(tr.querySelectorAll('td input'));
        if (!lbl || !inputs.length) return;
        rows.push({
            label: lbl.innerText,
            values: inputs.map(function(inp) { return inp.value; }),
            types: inputs.map(function(inp) { return inp.type || 'text'; })
        });
    });
    return rows;
}

function restoreSectionRows(tbodyId, savedRows) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;

    tbody.innerHTML = '';
    (savedRows || []).forEach(function(r) {
        const vals = Array.isArray(r.values) ? r.values : [r.val || ''];
        const types = Array.isArray(r.types) ? r.types : [r.type || 'text'];
        const extras = vals.slice(1).map(function(v, idx) {
            return { val: v, type: types[idx + 1] || 'text' };
        });
        tbody.appendChild(createRow(tbodyId, r.label || 'Field', vals[0] || '', types[0] || 'text', extras));
    });
    normalizeSectionRows(tbodyId);
}

const ACCENT_MAP = {};
document.querySelectorAll('#themeSelect option').forEach(function(opt) {
    ACCENT_MAP[opt.value] = opt.dataset.accent || '#0f766e';
});

function applyTheme(color) {
    function normalizeHex(hex) {
        const raw = (hex || '').replace('#', '').trim();
        if (raw.length === 3) return '#' + raw.split('').map(function(c) { return c + c; }).join('');
        if (raw.length === 6) return '#' + raw;
        return '#134074';
    }

    function hexToRgb(hex) {
        const h = normalizeHex(hex).slice(1);
        return {
            r: parseInt(h.slice(0, 2), 16),
            g: parseInt(h.slice(2, 4), 16),
            b: parseInt(h.slice(4, 6), 16)
        };
    }

    function mixHex(hexA, hexB, weight) {
        const a = hexToRgb(hexA);
        const b = hexToRgb(hexB);
        const w = Math.max(0, Math.min(1, weight));
        const r = Math.round(a.r * (1 - w) + b.r * w);
        const g = Math.round(a.g * (1 - w) + b.g * w);
        const bch = Math.round(a.b * (1 - w) + b.b * w);
        return '#' + [r, g, bch].map(function(v) { return v.toString(16).padStart(2, '0'); }).join('');
    }

    const root = document.documentElement;
    const safeColor = normalizeHex(color);
    const primaryDark = mixHex(safeColor, '#000000', 0.36);
    const primaryLight = mixHex(safeColor, '#ffffff', 0.86);
    root.style.setProperty('--primary', safeColor);
    root.style.setProperty('--primary-dark', primaryDark);
    root.style.setProperty('--primary-light', primaryLight);
    const rgb = hexToRgb(safeColor);
    root.style.setProperty('--primary-rgb', rgb.r + ', ' + rgb.g + ', ' + rgb.b);
    const accent = ACCENT_MAP[color] || '#0f766e';
    const accentRgb = hexToRgb(accent);
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-light', mixHex(accent, '#ffffff', 0.82));
    root.style.setProperty('--accent-rgb', accentRgb.r + ', ' + accentRgb.g + ', ' + accentRgb.b);
    localStorage.setItem('theme', safeColor);
}

function changeFont(f) {
    document.documentElement.style.setProperty('--base-font', f);
    localStorage.setItem('font', f);
}

function changeFontSize(s) {
    document.documentElement.style.setProperty('--base-size', s + 'pt');
    localStorage.setItem('fontSize', s);
}

function collectData() {
    const sections = {};
    STATIC_SECTION_IDS.forEach(function(id) {
        sections[id] = serializeSectionRows(id);
    });

    const customBlocks = [];
    document.querySelectorAll('table.custom-table').forEach(function(table) {
        const tools = table.previousElementSibling;
        const heading = tools ? tools.previousElementSibling : null;
        const tbody = table.querySelector('tbody');
        if (!heading || !tbody) return;

        customBlocks.push({
            title: cleanHeadingText(heading.innerText),
            rows: serializeSectionRows(tbody.id)
        });
    });

    const svcRows = [];
    document.querySelectorAll('#serviceBody tr').forEach(function(tr) {
        const cells = [];
        tr.querySelectorAll('td').forEach(function(td) {
            const inp = td.querySelector('input');
            cells.push(inp ? inp.value : td.innerText);
        });
        svcRows.push(cells);
    });

    return {
        title: document.getElementById('titleText').value,
        office: document.getElementById('officeText').value,
        sections: sections,
        svcHeaders: getServiceHeaders(),
        svcRows: svcRows,
        prepName: document.getElementById('prepByName').value,
        prepDesig: document.getElementById('prepByDesig').value,
        verName: document.getElementById('verByName').value,
        verDesig: document.getElementById('verByDesig').value,
        theme: localStorage.getItem('theme'),
        font: localStorage.getItem('font'),
        fontSize: localStorage.getItem('fontSize'),
        customBlocks: customBlocks
    };
}

function saveData() {
    localStorage.setItem('pc_save', JSON.stringify(collectData()));
    alert('Saved successfully.');
}

function saveAs() {
    const fname = prompt('Save as filename (without extension):', 'Desktop_PC_History');
    if (!fname) return;
    localStorage.setItem('pc_save', JSON.stringify(collectData()));
    localStorage.setItem('pc_save_name', fname);
    alert('Saved as "' + fname + '" in browser storage.');
}

function loadAll() {
    const d = JSON.parse(localStorage.getItem('pc_save'));
    if (!d) { alert('No saved data found.'); return; }

    if (d.title) document.getElementById('titleText').value = d.title;
    if (d.office) document.getElementById('officeText').value = d.office;

    STATIC_SECTION_IDS.forEach(function(id) {
        if (!d.sections || !d.sections[id]) return;
        restoreSectionRows(id, d.sections[id]);
    });

    removeCustomBlocks();
    if (Array.isArray(d.customBlocks)) {
        d.customBlocks.forEach(function(block) {
            createCustomBlock(block.title || 'NEW BLOCK', block.rows || []);
        });
    }

    buildServiceHeader(d.svcHeaders);
    const svcBody = document.getElementById('serviceBody');
    svcBody.innerHTML = '';
    if (Array.isArray(d.svcRows) && d.svcRows.length) {
        d.svcRows.forEach(function(values) {
            addServiceRow();
            const tr = svcBody.lastElementChild;
            if (!tr) return;
            values.forEach(function(v, i) {
                if (!tr.cells[i]) return;
                const inp = tr.cells[i].querySelector('input');
                if (inp) inp.value = v || '';
            });
        });
    }
    renumberService();

    if (d.prepName) document.getElementById('prepByName').value = d.prepName;
    if (d.prepDesig) document.getElementById('prepByDesig').value = d.prepDesig;
    if (d.verName) document.getElementById('verByName').value = d.verName;
    if (d.verDesig) document.getElementById('verByDesig').value = d.verDesig;

    if (d.theme) {
        applyTheme(d.theme);
        document.getElementById('themeSelect').value = d.theme;
    }
    if (d.font) {
        document.documentElement.style.setProperty('--base-font', d.font);
        document.getElementById('fontSelect').value = d.font;
    }
    if (d.fontSize) {
        document.documentElement.style.setProperty('--base-size', d.fontSize + 'pt');
        document.getElementById('fontSizeInput').value = d.fontSize;
    }

    renumberBlockHeadings();
}

function saveAsPDF() {
    const fname = prompt('PDF Filename (without extension):', 'Desktop_PC_History');
    if (!fname) return;
    document.title = fname;
    window.print();
}

function prepareAndPrint() {
    const dates = document.querySelectorAll('input[type="date"]');
    dates.forEach(function(d) {
        if (!d.value) {
            d.setAttribute('data-was-date', '1');
            d.type = 'text';
            d.value = '';
        }
    });

    window.print();

    setTimeout(function() {
        dates.forEach(function(d) {
            if (d.getAttribute('data-was-date')) {
                d.type = 'date';
                d.value = '';
                d.removeAttribute('data-was-date');
            }
        });
    }, 1200);
}

window.onload = function() {
    initSection('equipBody');
    initSection('hardwareBody');
    initSection('softwareBody');
    initSection('purchaseBody');
    buildServiceHeader();
    for (let i = 0; i < 5; i++) addServiceRow();

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
        applyTheme(savedTheme);
        document.getElementById('themeSelect').value = savedTheme;
    }

    const savedFont = localStorage.getItem('font');
    if (savedFont) {
        document.documentElement.style.setProperty('--base-font', savedFont);
        document.getElementById('fontSelect').value = savedFont;
    }

    const savedSize = localStorage.getItem('fontSize');
    if (savedSize) {
        document.documentElement.style.setProperty('--base-size', savedSize + 'pt');
        document.getElementById('fontSizeInput').value = savedSize;
    }

    document.querySelectorAll('#historySheet h3').forEach(function(h) {
        h.dataset.baseTitle = cleanHeadingText(h.innerText).toUpperCase();
    });
    renumberBlockHeadings();
};
</script>
</body>
</html>
